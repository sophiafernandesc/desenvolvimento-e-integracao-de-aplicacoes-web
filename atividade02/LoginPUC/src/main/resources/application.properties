spring.application.name=LoginPUC
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/loginpuc
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Envio de email (SMTP)
# Sem 'spring.mail.host' o Spring Boot nao cria o bean JavaMailSender.
# As credenciais vem de variaveis de ambiente para nao irem para o Git.
# No Gmail use uma "senha de app" (nao a senha da conta):
#   export MAIL_USERNAME=seu.email@gmail.com
#   export MAIL_PASSWORD=xxxxxxxxxxxxxxxx
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente das mensagens. O Gmail exige que seja o mesmo usuario autenticado.
app.mail.from=${MAIL_USERNAME:}

# Base usada para montar o link de redefinicao enviado por email.
app.base-url=http://localhost:8080

# Nome exibido nas telas e nos emails.
app.name=LoginPUC

# Validade do token de recuperacao, em minutos.
app.reset-token-ttl-minutes=30

# Espera minima entre dois pedidos de recuperacao do mesmo usuario, em minutos.
# Evita que alguem inunde a caixa de entrada da vitima.
app.reset-token-cooldown-minutes=2
