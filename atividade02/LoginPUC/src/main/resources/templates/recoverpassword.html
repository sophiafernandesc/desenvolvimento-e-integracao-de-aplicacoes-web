<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha · LoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">

        <aside class="auth-visual">
            <img th:src="@{/images/img-login2.jpeg}" alt="">
            <div class="auth-visual-content">
                <span class="auth-visual-brand" th:text="${@environment.getProperty('app.name')}">LoginPUC</span>
                <p class="auth-visual-title">Esqueceu a senha?</p>
                <p class="auth-visual-text">
                    Enviamos um link seguro para o email cadastrado. Ele vale por 30 minutos.
                </p>
            </div>
        </aside>

        <main class="auth-panel">
            <form th:action="@{/recoverpassword}" method="post" class="auth-form">
                <header class="auth-header">
                    <h1 class="auth-title">Recuperar senha</h1>
                    <p class="auth-subtitle">Informe o email usado no cadastro.</p>
                </header>

                <div th:replace="~{fragments/alerts :: flash}"></div>

                <div class="field">
                    <label class="field-label" for="email">Email cadastrado</label>
                    <input class="field-input" type="email" id="email" name="email"
                           placeholder="voce@exemplo.com" autocomplete="email" required>
                </div>

                <button type="submit" class="btn auth-submit">Enviar instruções</button>

                <p class="auth-footer">
                    Lembrou a senha?
                    <a th:href="@{/login}">Voltar para o login</a>
                </p>
            </form>
        </main>

    </div>
</div>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
