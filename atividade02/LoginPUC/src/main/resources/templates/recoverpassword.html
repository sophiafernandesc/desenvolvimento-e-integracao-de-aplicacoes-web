<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
</head>
<body>
<div class="login-screen-container">
    <div class="login-image-logo-container">
        <img th:src="@{/images/img-login2.jpeg}" alt="Imagem PUC Minas">
    </div>
    <div class="login-form-container">
        <form th:action="@{/recoverpassword}" method="post" class="login-form">
            <h4 class="login-title">Recuperar senha</h4>

            <div th:replace="~{fragments/alerts :: flash}"></div>

            <input type="email" id="email" name="email" placeholder="Email cadastrado"
                   autocomplete="email" required>
            <div class="login-button-container">
                <button type="submit">Enviar instruções</button>
            </div>
            <p class="login-redirect-options">
                Lembrou a senha?<br>
                <a th:href="@{/login}">Voltar para o login</a>
            </p>
        </form>
    </div>
</div>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
