<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do usuário · LoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="home-shell">
    <div class="home-card">
        <img class="home-logo" th:src="@{/images/img-logo.jpeg}" alt="">

        <span class="home-badge">Sessão autenticada</span>

        <h1 class="home-title">Bem-vindo(a),
            <span th:text="${username}">usuário</span>!
        </h1>
        <p class="home-subtitle">Você está acessando uma área protegida do sistema.</p>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <form th:action="@{/logout}" method="post" class="home-logout">
            <button type="submit" class="btn btn-accent">Sair</button>
        </form>
    </div>
</div>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
