<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Usuário</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="home-card">
    <img class="home-logo" th:src="@{/images/img-logo.jpeg}" alt="Logo PUC Minas">
    <h1 class="home-title">Bem-vindo(a),
        <span th:text="${username}">usuário</span>!
    </h1>
    <p class="home-subtitle">Você está autenticado e acessando uma área protegida.</p>
    <form th:action="@{/logout}" method="post" class="home-logout">
        <button type="submit">Sair</button>
    </form>
</div>
</body>
</html>
