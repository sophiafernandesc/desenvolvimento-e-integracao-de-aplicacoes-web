<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
</head>
<body>
<div class="register-screen-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/img-logo.jpeg}" alt="Logo PUC Minas">
    </div>
    <div class="register-form-container">
        <form th:action="@{/register}" th:object="${usuario}" method="post" class="register-form">
            <h4 class="register-title">Cadastro</h4>

            <div th:replace="~{fragments/alerts :: flash}"></div>
            <div th:replace="~{fragments/alerts :: globalErrors}"></div>

            <input type="text" th:field="*{username}" th:errorclass="input-error"
                   placeholder="Username" aria-label="Username" autocomplete="username" required>
            <span th:replace="~{fragments/alerts :: fieldError('username')}"></span>

            <input type="email" th:field="*{email}" th:errorclass="input-error"
                   placeholder="Email" aria-label="Email" autocomplete="email" required>
            <span th:replace="~{fragments/alerts :: fieldError('email')}"></span>

            <input type="password" th:field="*{password}" th:errorclass="input-error"
                   placeholder="Senha" aria-label="Senha" autocomplete="new-password" required>
            <span th:replace="~{fragments/alerts :: fieldError('password')}"></span>
            <small class="register-hint">
                Mínimo de 8 caracteres, com letra maiúscula, minúscula, número e caractere especial.
            </small>

            <input type="password" th:field="*{confirmPassword}" th:errorclass="input-error"
                   placeholder="Confirmar senha" aria-label="Confirmar senha" autocomplete="new-password" required>
            <span th:replace="~{fragments/alerts :: fieldError('confirmPassword')}"></span>

            <div class="register-button-container">
                <button type="submit">Cadastrar</button>
            </div>

            <p class="register-redirect-options">
                Já tem uma conta?<br>
                <a th:href="@{/login}">Voltar para o login</a>
            </p>
        </form>
    </div>
</div>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
