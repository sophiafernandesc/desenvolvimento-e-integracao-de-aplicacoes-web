<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta · LoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">

        <aside class="auth-visual">
            <img th:src="@{/images/img-logo.jpeg}" alt="">
            <div class="auth-visual-content">
                <p class="auth-visual-title">Crie sua conta</p>
            </div>
        </aside>

        <main class="auth-panel">
            <form th:action="@{/register}" th:object="${usuario}" method="post" class="auth-form">
                <header class="auth-header">
                    <h1 class="auth-title">Cadastro</h1>
                    <p class="auth-subtitle">Preencha os dados abaixo para começar.</p>
                </header>

                <div th:replace="~{fragments/alerts :: flash}"></div>
                <div th:replace="~{fragments/alerts :: globalErrors}"></div>

                <div class="field">
                    <label class="field-label" for="username">Nome de usuário</label>
                    <input class="field-input" type="text" id="username" th:field="*{username}"
                           th:errorclass="input-error" placeholder="seu.usuario"
                           autocomplete="username" required>
                    <span th:replace="~{fragments/alerts :: fieldError('username')}"></span>
                </div>

                <div class="field">
                    <label class="field-label" for="email">Email</label>
                    <input class="field-input" type="email" id="email" th:field="*{email}"
                           th:errorclass="input-error" placeholder="voce@exemplo.com"
                           autocomplete="email" required>
                    <span th:replace="~{fragments/alerts :: fieldError('email')}"></span>
                </div>

                <div class="field">
                    <label class="field-label" for="password">Senha</label>
                    <input class="field-input" type="password" id="password" th:field="*{password}"
                           th:errorclass="input-error" placeholder="••••••••"
                           autocomplete="new-password" required>
                    <span th:replace="~{fragments/alerts :: fieldError('password')}"></span>
                    <small class="field-hint">
                        Mínimo de 8 caracteres, com maiúscula, minúscula, número e caractere especial.
                    </small>
                </div>

                <div class="field">
                    <label class="field-label" for="confirmPassword">Confirmar senha</label>
                    <input class="field-input" type="password" id="confirmPassword"
                           th:field="*{confirmPassword}" th:errorclass="input-error"
                           placeholder="••••••••" autocomplete="new-password" required>
                    <span th:replace="~{fragments/alerts :: fieldError('confirmPassword')}"></span>
                </div>

                <button type="submit" class="btn auth-submit">Cadastrar</button>

                <p class="auth-footer">
                    Já tem uma conta?
                    <a th:href="@{/login}">Voltar para o login</a>
                </p>
            </form>
        </main>

    </div>
</div>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
