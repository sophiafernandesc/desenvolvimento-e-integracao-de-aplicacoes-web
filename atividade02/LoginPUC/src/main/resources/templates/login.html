<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-screen-container">
    <div class="login-image-logo-container">
        <img th:src="@{/images/img-login2.jpeg}" alt="Imagem PUC Minas">
    </div>
    <div class="login-form-container">
        <form th:action="@{/login}" method="post" class="login-form">
            <h4 class="login-title">Login</h4>
            <p class="login-success" th:if="${success}" th:text="${success}"></p>
            <p class="login-success" th:if="${param.logout}">Você saiu da sua conta.</p>
            <p class="login-error" th:if="${param.error}">Usuário ou senha inválidos.</p>
            <input type="text" id="username" name="username" placeholder="Usuário ou email" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>
            <p class="login-redirect-options">
                Ainda não tem cadastro?<br>
                <a th:href="@{/register}">Cadastre-se</a>
                <a th:href="@{/recoverpassword}">Esqueceu sua senha?</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
