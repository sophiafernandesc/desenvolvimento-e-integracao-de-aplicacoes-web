<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-screen-container">
    <div class="login-image-logo-container">
        <img th:src="@{/images/img-login2.jpeg}" alt="Imagem PUC Minas">
    </div>
    <div class="login-form-container">

        <!-- Token válido: mostra o formulário de nova senha. -->
        <form th:if="${tokenValido}" th:action="@{/resetpassword}" method="post"
              th:object="${resetPassword}" class="login-form">
            <h4 class="login-title">Nova senha</h4>
            <p class="login-error" th:if="${error}" th:text="${error}"></p>

            <!-- O token viaja escondido no form para voltar no POST. -->
            <input type="hidden" th:field="*{token}">

            <input type="password" th:field="*{password}" placeholder="Nova senha"
                   autocomplete="new-password" required>
            <p class="login-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>

            <input type="password" th:field="*{confirmPassword}" placeholder="Confirme a nova senha"
                   autocomplete="new-password" required>
            <p class="login-error" th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"></p>

            <div class="login-button-container">
                <button type="submit">Salvar nova senha</button>
            </div>
            <p class="login-redirect-options">
                <a th:href="@{/login}">Voltar para o login</a>
            </p>
        </form>

        <!-- Token ausente, inválido ou expirado: nem exibe o formulário. -->
        <div th:unless="${tokenValido}" class="login-form">
            <h4 class="login-title">Nova senha</h4>
            <p class="login-error" th:if="${error}" th:text="${error}"></p>
            <p class="login-redirect-options">
                <a th:href="@{/recoverpassword}">Solicitar novo link</a>
                <a th:href="@{/login}">Voltar para o login</a>
            </p>
        </div>

    </div>
</div>
</body>
</html>
